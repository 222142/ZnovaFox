
<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Useful text tools including word counter and character counter."
    >

    <link
        rel="stylesheet"

    <style>

        .text-tool {
            max-width: 800px;
            margin: 40px auto;
            padding: 25px;

            border: 1px solid #ddd;
            border-radius: 20px;

            background: var(--card-bg, #fff);
        }

        .text-area {
            width: 100%;
            min-height: 280px;

            box-sizing: border-box;

            padding: 16px;

            border: 1px solid #ddd;
            border-radius: 14px;

            resize: vertical;

            font: inherit;
            font-size: 16px;

            line-height: 1.6;
        }

        .text-stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-top: 15px;
        }

        .stat-box {
            padding: 15px;

            border-radius: 12px;

            background: #f4f4f4;

            text-align: center;
        }

        .stat-box strong {
            display: block;

            font-size: 22px;

            margin-bottom: 5px;
        }

        .text-actions {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 18px;
        }

        .text-actions button {
            padding: 11px 16px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 600;
        }

        .text-primary {
            background: #6c4cff;
            color: white;
        }

        .text-secondary {
            background: #eeeeee;
            color: #222;
        }

        .text-message {
            margin-top: 12px;

            font-size: 14px;
        }

        body.dark .text-tool {
            border-color: #333;
        }

        body.dark .stat-box {
            background: #252a32;
        }

        body.dark .text-secondary {
            background: #252a32;
            color: white;
        }


        @media (max-width: 600px) {

            .text-stats {
                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>

<script>

const textInput =
    document.getElementById("textInput");

const wordCount =
    document.getElementById("wordCount");

const charCount =
    document.getElementById("charCount");

const sentenceCount =
    document.getElementById("sentenceCount");

const upperBtn =
    document.getElementById("upperBtn");

const lowerBtn =
    document.getElementById("lowerBtn");

const copyBtn =
    document.getElementById("copyBtn");

const clearBtn =
    document.getElementById("clearBtn");

const textMessage =
    document.getElementById("textMessage");



function updateTextStats() {

    const text =
        textInput.value;


    const trimmedText =
        text.trim();


    let words = 0;


    if (trimmedText.length > 0) {

        words =
            trimmedText
                .split(/\s+/)
                .length;

    }


    const characters =
        text.length;


    const sentences =
        trimmedText.length === 0
            ? 0
            : trimmedText
                .split(/[.!?]+/)
                .filter(
                    sentence =>
                        sentence.trim().length > 0
                )
                .length;


    wordCount.textContent =
        words;


    charCount.textContent =
        characters;


    sentenceCount.textContent =
        sentences;

}



textInput.addEventListener(
    "input",
    updateTextStats
);



upperBtn.addEventListener(
    "click",
    function () {

        textInput.value =
            textInput.value.toUpperCase();

        updateTextStats();

    }
);



lowerBtn.addEventListener(
    "click",
    function () {

        textInput.value =
            textInput.value.toLowerCase();

        updateTextStats();

    }
);



copyBtn.addEventListener(
    "click",
    async function () {

        if (!textInput.value) {

            textMessage.textContent =
                "There is no text to copy.";

            return;

        }


        try {

            await navigator.clipboard.writeText(
                textInput.value
            );

            textMessage.textContent =
                "Text copied successfully.";

        } catch {

            textMessage.textContent =
                "Copy failed. Please copy manually.";

        }

    }
);



clearBtn.addEventListener(
    "click",
    function () {

        textInput.value = "";

        updateTextStats();

        textMessage.textContent = "";

    }
);


updateTextStats();

</script>
