<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ludo Game - ZnovaFox</title>

<style>
/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #eef3ff, #f7f8fc 55%);

    color: #171a21;

    transition:
        background .3s ease,
        color .3s ease;
}

button {
    font-family: inherit;
}

.ludo-container {
    width: min(1100px, 94%);
    margin: auto;
}


/* =====================================================
   TOP BAR
===================================================== */

.ludo-topbar {
    padding: 18px 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;
}

.ludo-logo {
    color: inherit;
    text-decoration: none;

    font-size: 23px;
    font-weight: 800;
}

.ludo-logo span {
    color: #6c4cff;
}

.top-actions {
    display: flex;
    gap: 8px;
}

.top-btn {
    border: 1px solid #dfe3ea;

    background: #fff;

    color: #222;

    border-radius: 11px;

    padding: 10px 13px;

    cursor: pointer;

    font-weight: 700;

    transition: .2s ease;
}

.top-btn:hover {
    transform: translateY(-2px);
    border-color: #6c4cff;
}


/* =====================================================
   START SCREEN
===================================================== */

.start-screen {
    min-height: calc(100vh - 80px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px 0 50px;
}

.start-box {
    width: min(600px, 100%);

    padding: 35px 25px;

    text-align: center;

    background: rgba(255,255,255,.92);

    border: 1px solid #e1e5ed;

    border-radius: 28px;

    box-shadow:
        0 20px 60px rgba(25,35,70,.10);
}

.ludo-title {
    font-size: clamp(34px, 7vw, 58px);

    margin-bottom: 10px;
}

.ludo-subtitle {
    opacity: .65;

    line-height: 1.6;

    margin-bottom: 28px;
}

.mode-title {
    margin-bottom: 14px;
}

.mode-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-bottom: 25px;
}

.mode-btn {
    min-height: 70px;

    border: 1px solid #dfe3ea;

    background: #fff;

    border-radius: 15px;

    cursor: pointer;

    transition: .2s ease;
}

.mode-btn strong {
    display: block;
    font-size: 16px;
}

.mode-btn span {
    display: block;

    margin-top: 5px;

    font-size: 11px;

    opacity: .6;
}

.mode-btn:hover {
    transform: translateY(-3px);
    border-color: #6c4cff;
}

.mode-btn.selected {
    background: #6c4cff;
    border-color: #6c4cff;
    color: #fff;

    box-shadow:
        0 8px 22px rgba(108,76,255,.25);
}

.start-btn {
    width: 100%;

    padding: 15px;

    border: 0;

    border-radius: 14px;

    background: linear-gradient(
        135deg,
        #6c4cff,
        #8b5cf6
    );

    color: #fff;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(108,76,255,.25);

    transition: .2s ease;
}

.start-btn:hover {
    transform: translateY(-3px);
}


/* =====================================================
   GAME SCREEN
===================================================== */

.game-screen {
    display: none;

    padding-bottom: 45px;
}

.game-header {
    text-align: center;

    padding: 8px 0 18px;
}

.game-header h1 {
    font-size: clamp(27px, 5vw, 40px);
}

.turn-text {
    margin-top: 7px;

    font-weight: 700;

    opacity: .7;
}


/* =====================================================
   PLAYER INFO
===================================================== */

.player-info {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;

    margin-bottom: 15px;
}

.player-card {
    padding: 10px;

    border-radius: 13px;

    background: #fff;

    border: 1px solid #e0e4eb;

    text-align: center;

    transition: .2s ease;
}

.player-card strong {
    display: block;

    font-size: 13px;
}

.player-card span {
    display: block;

    margin-top: 4px;

    font-size: 10px;

    opacity: .55;
}

.player-card.active {
    transform: translateY(-2px);

    box-shadow:
        0 7px 18px rgba(0,0,0,.08);

    border-color: #6c4cff;
}


/* =====================================================
   BOARD AREA
===================================================== */

.game-layout {
    display: grid;

    grid-template-columns:
        minmax(0, 700px)
        230px;

    gap: 20px;

    align-items: start;

    justify-content: center;
}


/* =====================================================
   BOARD
===================================================== */

.board-wrap {
    width: 100%;

    display: flex;
    justify-content: center;
}

.board {
    position: relative;

    width: min(92vw, 650px);
    aspect-ratio: 1 / 1;

    background: #fff;

    border: 5px solid #20242c;

    border-radius: 12px;

    box-shadow:
        0 20px 45px rgba(0,0,0,.12);

    overflow: hidden;
}


/* HOME AREAS */

.home {
    position: absolute;

    width: 36%;
    height: 36%;

    border: 3px solid #20242c;

    display: flex;
    align-items: center;
    justify-content: center;
}

.home-inner {
    width: 68%;
    height: 68%;

    border-radius: 22%;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 8%;

    padding: 10%;
}

.home-inner div {
    border-radius: 50%;

    border: 3px solid rgba(0,0,0,.2);

    background: rgba(255,255,255,.75);

    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.15);
}

.home-red {
    left: 0;
    top: 0;
    background: #ff4b4b;
}

.home-green {
    right: 0;
    top: 0;
    background: #35c96b;
}

.home-yellow {
    left: 0;
    bottom: 0;
    background: #ffd83d;
}

.home-blue {
    right: 0;
    bottom: 0;
    background: #3c8df5;
}


/* CENTER */

.center-home {
    position: absolute;

    left: 32%;
    top: 32%;

    width: 36%;
    height: 36%;

    background:
        conic-gradient(
            #35c96b 0 25%,
            #3c8df5 25% 50%,
            #ffd83d 50% 75%,
            #ff4b4b 75% 100%
        );

    clip-path: polygon(
        0 0,
        100% 0,
        100% 100%,
        0 100%
    );

    display: flex;
    align-items: center;
    justify-content: center;
}

.center-home::after {
    content: "🏆";

    width: 55%;
    height: 55%;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #fff;

    font-size: clamp(20px, 5vw, 38px);

    box-shadow:
        0 5px 15px rgba(0,0,0,.15);
}


/* =====================================================
   TRACK
===================================================== */

.track {
    position: absolute;

    left: 36%;
    top: 0;

    width: 28%;
    height: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(6, 1fr);
}

.track.bottom {
    top: 64%;

    transform: rotate(180deg);
}

.track.left {
    left: 0;
    top: 36%;

    width: 36%;
    height: 28%;

    transform: rotate(-90deg);

    transform-origin: center;
}

.track.right {
    left: 64%;
    top: 36%;

    width: 36%;
    height: 28%;

    transform: rotate(90deg);

    transform-origin: center;
}

.cell {
    border: 1px solid #bfc5cf;

    background: #f8f9fb;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 8px;
}

.cell.safe {
    background: #e9e5ff;
}

.cell.green {
    background: #bff2d1;
}

.cell.blue {
    background: #c7ddff;
}

.cell.yellow {
    background: #fff0a7;
}

.cell.red {
    background: #ffcaca;
}


/* =====================================================
   TOKENS
===================================================== */

.token {
    position: absolute;

    width: 8%;

    aspect-ratio: 1 / 1;

    border-radius: 50%;

    border: 3px solid #fff;

    box-shadow:
        0 3px 8px rgba(0,0,0,.28);

    z-index: 10;

    cursor: pointer;

    transition:
        left .35s ease,
        top .35s ease,
        transform .2s ease;
}

.token:hover {
    transform: scale(1.12);
}

.token.movable {
    animation:
        tokenPulse 1s infinite;
}

@keyframes tokenPulse {

    50% {
        box-shadow:
            0 0 0 5px rgba(108,76,255,.20),
            0 5px 12px rgba(0,0,0,.25);
    }

}

.token.red {
    background:
        linear-gradient(135deg,#ff6767,#dc2525);
}

.token.green {
    background:
        linear-gradient(135deg,#62e98d,#18a64d);
}

.token.yellow {
    background:
        linear-gradient(135deg,#ffe76b,#eab400);
}

.token.blue {
    background:
        linear-gradient(135deg,#67a7ff,#1765c5);
}


/* =====================================================
   CONTROL PANEL
===================================================== */

.control-panel {
    padding: 18px;

    border-radius: 20px;

    background: #fff;

    border: 1px solid #e0e4eb;

    box-shadow:
        0 10px 30px rgba(0,0,0,.06);
}

.dice-box {
    text-align: center;

    padding-bottom: 15px;

    border-bottom: 1px solid #e5e7eb;
}

.dice {
    width: 85px;
    height: 85px;

    margin: 0 auto 13px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background: #fff;

    border: 2px solid #252932;

    font-size: 47px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.10);

    user-select: none;
}

.dice.rolling {
    animation: diceRoll .45s ease;
}

@keyframes diceRoll {

    25% {
        transform: rotate(15deg) scale(1.08);
    }

    50% {
        transform: rotate(-15deg) scale(.94);
    }

    75% {
        transform: rotate(10deg) scale(1.05);
    }

}

.roll-btn {
    width: 100%;

    padding: 13px;

    border: 0;

    border-radius: 12px;

    background: #6c4cff;

    color: #fff;

    font-weight: 800;

    cursor: pointer;
}

.roll-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.info-box {
    margin-top: 15px;

    padding: 12px;

    border-radius: 12px;

    background: #f6f7fa;

    font-size: 12px;

    line-height: 1.6;
}

.control-buttons {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 8px;

    margin-top: 12px;
}

.small-btn {
    padding: 10px;

    border-radius: 10px;

    border: 1px solid #dfe3ea;

    background: #fff;

    cursor: pointer;

    font-weight: 700;

    font-size: 12px;
}


/* =====================================================
   WINNER
===================================================== */

.winner-overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.65);

    backdrop-filter: blur(5px);
}

.winner-box {
    width: min(420px,100%);

    padding: 35px 25px;

    text-align: center;

    border-radius: 25px;

    background: #fff;

    box-shadow:
        0 25px 70px rgba(0,0,0,.3);
}

.winner-box .trophy {
    font-size: 65px;

    margin-bottom: 10px;
}

.winner-box h2 {
    margin-bottom: 10px;
}

.winner-box p {
    opacity: .65;

    margin-bottom: 20px;
}


/* =====================================================
   DARK MODE
===================================================== */

body.dark {
    background:
        radial-gradient(circle at top, #1c2330, #0d1015 60%);

    color: #fff;
}

body.dark .start-box,
body.dark .player-card,
body.dark .control-panel,
body.dark .winner-box {
    background: #171b22;

    border-color: #2e3541;
}

body.dark .mode-btn,
body.dark .top-btn,
body.dark .small-btn {
    background: #1b2028;

    color: #fff;

    border-color: #343b47;
}

body.dark .mode-btn:hover,
body.dark .top-btn:hover {
    border-color: #8b6cff;
}

body.dark .board {
    border-color: #e5e7eb;
}

body.dark .cell {
    background: #252a32;

    border-color: #454c58;
}

body.dark .cell.safe {
    background: #302d4d;
}

body.dark .home-inner div {
    background: rgba(255,255,255,.8);
}

body.dark .info-box {
    background: #222730;
}

body.dark .dice {
    background: #f7f7f7;
    color: #111;
}

body.dark .small-btn {
    color: #fff;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 850px) {

    .game-layout {
        grid-template-columns: 1fr;
    }

    .control-panel {
        width: min(650px,100%);
        margin: auto;
    }

    .player-info {
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media (max-width: 600px) {

    .ludo-container {
        width: 95%;
    }

    .ludo-topbar {
        padding: 12px 0;
    }

    .ludo-logo {
        font-size: 19px;
    }

    .start-box {
        padding: 28px 16px;

        border-radius: 22px;
    }

    .mode-grid {
        grid-template-columns:
            repeat(2,1fr);
    }

    .mode-btn {
        min-height: 65px;
    }

    .board {
        width: 96vw;

        border-width: 3px;
    }

    .control-panel {
        padding: 14px;
    }

    .dice {
        width: 70px;
        height: 70px;

        font-size: 38px;
    }

}


/* =====================================================
   HIDDEN
===================================================== */

.hidden {
    display: none !important;
}

</style>
</head>


<body>

     TOP
===================================================== -->

<div class="ludo-container">

</div>

<div

            id="winnerNewBtn">
            🎮 Play Again
        </button>

    </div>

<script>

/* =====================================================
   GAME DATA
===================================================== */

const playersData = [

    {
        name: "Red",
        color: "red",
        emoji: "🔴",
        start: 0
    },

    {
        name: "Green",
        color: "green",
        emoji: "🟢",
        start: 13
    },

    {
        name: "Yellow",
        color: "yellow",
        emoji: "🟡",
        start: 26
    },

    {
        name: "Blue",
        color: "blue",
        emoji: "🔵",
        start: 39
    }

];


let selectedMode = "2";

let players = [];

let currentPlayer = 0;

let diceValue = 0;

let soundEnabled = true;

let gameOver = false;


/*
    Each token:
    position = -1 means home
    position 0-51 = track
    position 52 = finished
*/

let tokens = [];


/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const gameScreen =
    document.getElementById("gameScreen");

const startBtn =
    document.getElementById("startBtn");

const board =
    document.getElementById("board");

const tokensBox =
    document.getElementById("tokens");

const dice =
    document.getElementById("dice");

const rollBtn =
    document.getElementById("rollBtn");

const turnText =
    document.getElementById("turnText");

const infoBox =
    document.getElementById("infoBox");

const playerInfo =
    document.getElementById("playerInfo");

const soundBtn =
    document.getElementById("soundBtn");

const themeBtn =
    document.getElementById("themeBtn");

const winnerOverlay =
    document.getElementById("winnerOverlay");

const winnerTitle =
    document.getElementById("winnerTitle");


/* =====================================================
   MODE SELECT
===================================================== */

document.querySelectorAll(".mode-btn")
.forEach(button => {

    button.addEventListener("click", () => {

        document
        .querySelectorAll(".mode-btn")
        .forEach(btn =>
            btn.classList.remove("selected")
        );

        button.classList.add("selected");

        selectedMode =
            button.dataset.mode;

    });

});


/* =====================================================
   SOUND
===================================================== */

let audioContext = null;

function beep(
    frequency = 500,
    duration = .08,
    type = "sine"
) {

    if (!soundEnabled) return;

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = type;

        oscillator.frequency.value =
            frequency;

        gain.gain.value = .04;

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + duration
        );

        oscillator.stop(
            audioContext.currentTime + duration
        );

    } catch(e) {}

}


soundBtn.addEventListener(
    "click",
    () => {

        soundEnabled =
            !soundEnabled;

        soundBtn.textContent =
            soundEnabled
            ? "🔊 Sound"
            : "🔇 Muted";

    }
);


/* =====================================================
   THEME
===================================================== */

themeBtn.addEventListener(
    "click",
    () => {

        document.body.classList.toggle("dark");

        themeBtn.textContent =
            document.body.classList.contains("dark")
            ? "☀️"
            : "🌙";

    }
);


/* =====================================================
   CREATE TRACK
===================================================== */

function createTrack(id) {

    const track =
        document.getElementById(id);

    track.innerHTML = "";

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const cell =
            document.createElement("div");

        cell.className = "cell";

        if (
            i === 0 ||
            i === 8 ||
            i === 17
        ) {

            cell.classList.add("safe");

        }

        track.appendChild(cell);

    }

}

createTrack("trackTop");
createTrack("trackBottom");
createTrack("trackLeft");
createTrack("trackRight");


/* =====================================================
   START GAME
===================================================== */

startBtn.addEventListener(
    "click",
    startGame
);


function startGame() {

    startScreen.style.display =
        "none";

    gameScreen.style.display =
        "block";

    gameOver = false;

    currentPlayer = 0;

    diceValue = 0;

    players = [];

    tokens = [];

    let count = 2;

    let computerCount = 0;

    if (selectedMode === "3")
        count = 3;

    if (selectedMode === "4")
        count = 4;

    if (selectedMode === "2cpu") {

        count = 2;
        computerCount = 1;

    }

    if (selectedMode === "3cpu") {

        count = 3;
        computerCount = 2;

    }

    if (selectedMode === "4cpu") {

        count = 4;
        computerCount = 3;

    }


    for (
        let i = 0;
        i < count;
        i++
    ) {

        players.push({

            ...playersData[i],

            computer:
                i >= count - computerCount

        });

    }


    players.forEach(
        (player,index) => {

            for (
                let t = 0;
                t < 4;
                t++
            ) {

                tokens.push({

                    player: index,

                    token: t,

                    position: -1,

                    element: null

                });

            }

        }
    );


    createPlayerInfo();

    createTokens();

    updateTurn();

    rollBtn.disabled = false;

    infoBox.textContent =
        "Roll the dice. You need 6 to bring a token out.";

}


/* =====================================================
   PLAYER INFO
===================================================== */

function createPlayerInfo() {

    playerInfo.innerHTML = "";

    players.forEach(
        (player,index) => {

            const card =
                document.createElement("div");

            card.className =
                "player-card";

            card.id =
                "playerCard-" + index;

            card.innerHTML = `

                <strong>
                    ${player.emoji}
                    ${player.name}
                    ${player.computer ? "🤖" : ""}
                </strong>

                <span>
                    ${player.computer
                        ? "Computer"
                        : "Player"}
                </span>

            `;

            playerInfo.appendChild(card);

        }
    );

}


/* =====================================================
   CREATE TOKENS
===================================================== */

function createTokens() {

    tokensBox.innerHTML = "";

    tokens.forEach(
        (token,index) => {

            const el =
                document.createElement("div");

            el.className =
                `token ${players[token.player].color}`;

            el.dataset.index =
                index;

            el.addEventListener(
                "click",
                () => {

                    moveClickedToken(index);

                }
            );

            token.element = el;

            tokensBox.appendChild(el);

            positionToken(
                token,
                index
            );

        }
    );

}


/* =====================================================
   TOKEN POSITION
===================================================== */

function positionToken(
    token,
    globalIndex
) {

    const player =
        players[token.player];

    let x;
    let y;


    /* HOME */

    if (token.position === -1) {

        const spots = [

            [10,10],
            [23,10],
            [10,23],
            [23,23]

        ];

        if (player.color === "green") {

            x = 66 + spots[token.token][0] / 4;

            y = spots[token.token][1];

        }

        else if (player.color === "yellow") {

            x = spots[token.token][0];

            y = 66 + spots[token.token][1] / 4;

        }

        else if (player.color === "blue") {

            x = 66 + spots[token.token][0] / 4;

            y = 66 + spots[token.token][1] / 4;

        }

        else {

            x = spots[token.token][0];

            y = spots[token.token][1];

        }

    }


    /* FINISH */

    else if (token.position >= 52) {

        x = 46 + token.token * 3;

        y = 46;

    }


    /* TRACK */

    else {

        const coords =
            getTrackPosition(
                token.position
            );

        x = coords[0];
        y = coords[1];

    }


    token.element.style.left =
        `calc(${x}% - 4%)`;

    token.element.style.top =
        `calc(${y}% - 4%)`;

}


/* =====================================================
   TRACK COORDINATES
===================================================== */

function getTrackPosition(pos) {

    const p =
        ((pos % 52) + 52) % 52;


    /*
       Simple 52-position loop
       around the board.
    */

    const path = [];


    /* TOP */

    for (
        let i = 0;
        i < 13;
        i++
    ) {

        path.push([
            37 + i * 2.15,
            28
        ]);

    }


    /* RIGHT */

    for (
        let i = 0;
        i < 13;
        i++
    ) {

        path.push([
            70,
            37 + i * 2.15
        ]);

    }


    /* BOTTOM */

    for (
        let i = 0;
        i < 13;
        i++
    ) {

        path.push([
            63 - i * 2.15,
            70
        ]);

    }


    /* LEFT */

    for (
        let i = 0;
        i < 13;
        i++
    ) {

        path.push([
            28,
            63 - i * 2.15
        ]);

    }


    return path[p];

}


/* =====================================================
   ROLL DICE
===================================================== */

rollBtn.addEventListener(
    "click",
    rollDice
);


function rollDice() {

    if (gameOver) return;

    const player =
        players[currentPlayer];

    if (player.computer)
        return;


    rollBtn.disabled = true;

    dice.classList.add("rolling");

    let rolls = 0;

    const animation =
        setInterval(
            () => {

                const temp =
                    Math.floor(
                        Math.random() * 6
                    ) + 1;

                dice.textContent =
                    diceEmoji(temp);

                rolls++;

                beep(
                    300 + temp * 50,
                    .04
                );

                if (rolls >= 8) {

                    clearInterval(animation);

                    dice.classList.remove(
                        "rolling"
                    );

                    diceValue =
                        Math.floor(
                            Math.random() * 6
                        ) + 1;

                    dice.textContent =
                        diceEmoji(
                            diceValue
                        );

                    beep(
                        700,
                        .12,
                        "square"
                    );

                    handleDiceResult();

                }

            },
            70
        );

}


/* =====================================================
   DICE EMOJI
===================================================== */

function diceEmoji(n) {

    const faces = [

        "",
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"

    ];

    return faces[n];

}


/* =====================================================
   HANDLE DICE
===================================================== */

function handleDiceResult() {

    const movable =
        getMovableTokens(
            currentPlayer,
            diceValue
        );


    if (movable.length === 0) {

        infoBox.textContent =
            `${players[currentPlayer].name} cannot move.`;

        setTimeout(
            nextTurn,
            900
        );

        return;

    }


    if (
        players[currentPlayer].computer
    ) {

        setTimeout(
            () => {

                computerMove(
                    movable
                );

            },
            500
        );

        return;

    }


    infoBox.textContent =
        "Choose a glowing token to move.";

    movable.forEach(
        index => {

            tokens[index]
            .element
            .classList.add(
                "movable"
            );

        }
    );

}


/* =====================================================
   MOVABLE TOKENS
===================================================== */

function getMovableTokens(
    playerIndex,
    dice
) {

    const result = [];

    tokens.forEach(
        (token,index) => {

            if (
                token.player !== playerIndex
            )
                return;

            if (
                token.position >= 52
            )
                return;


            if (
                token.position === -1
            ) {

                if (dice === 6)
                    result.push(index);

            }

            else {

                if (
                    token.position + dice
                    <= 51
                ) {

                    result.push(index);

                }

            }

        }
    );

    return result;

}


/* =====================================================
   CLICK TOKEN
===================================================== */

function moveClickedToken(index) {

    if (gameOver) return;

    const token =
        tokens[index];

    if (
        token.player !== currentPlayer
    )
        return;

    const movable =
        getMovableTokens(
            currentPlayer,
            diceValue
        );

    if (
        !movable.includes(index)
    )
        return;

    moveToken(index);

}


/* =====================================================
   MOVE TOKEN
===================================================== */

function moveToken(index) {

    const token =
        tokens[index];

    const player =
        players[token.player];


    tokens.forEach(
        t =>
            t.element.classList.remove(
                "movable"
            )
    );


    /* ENTER BOARD */

    if (token.position === -1) {

        token.position =
            player.start;

    }

    else {

        token.position +=
            diceValue;

    }


    beep(
        550,
        .08,
        "triangle"
    );


    positionToken(
        token,
        index
    );


    /* CAPTURE */

    if (
        token.position < 52
    ) {

        captureOpponents(
            token
        );

    }


    /* WIN TOKEN */

    if (
        token.position >= 51
    ) {

        token.position = 52;

        positionToken(
            token,
            index
        );

        beep(
            900,
            .15,
            "square"
        );

    }


    /* WIN GAME */

    const playerTokens =
        tokens.filter(
            t =>
                t.player ===
                currentPlayer
        );

    if (
        playerTokens.every(
            t =>
                t.position >= 52
        )
    ) {

        showWinner(
            currentPlayer
        );

        return;

    }


    /*
       Rolling 6 gives another turn
    */

    if (diceValue === 6) {

        infoBox.textContent =
            `${player.name} rolled 6. Roll again.`;

        diceValue = 0;

        rollBtn.disabled =
            player.computer;

        if (player.computer) {

            setTimeout(
                computerTurn,
                600
            );

        }

        return;

    }


    setTimeout(
        nextTurn,
        500
    );

}


/* =====================================================
   CAPTURE
===================================================== */

function captureOpponents(
    movingToken
) {

    const player =
        players[movingToken.player];


    const absolute =
        (
            player.start +
            movingToken.position
        ) % 52;


    const safe =
        [0,8,13,21,26,34,39,47];


    if (
        safe.includes(
            absolute
        )
    )
        return;


    tokens.forEach(
        token => {

            if (
                token.player ===
                movingToken.player
            )
                return;

            if (
                token.position < 0 ||
                token.position >= 52
            )
                return;


            const opponentPlayer =
                players[token.player];

            const opponentAbsolute =
                (
                    opponentPlayer.start +
                    token.position
                ) % 52;


            if (
                opponentAbsolute ===
                absolute
            ) {

                token.position = -1;

                positionToken(
                    token,
                    tokens.indexOf(token)
                );

                beep(
                    220,
                    .15,
                    "sawtooth"
                );

                infoBox.textContent =
                    `${player.name} captured a token!`;

            }

        }
    );

}


/* =====================================================
   COMPUTER
===================================================== */

function computerTurn() {

    if (gameOver) return;

    const player =
        players[currentPlayer];

    if (!player.computer)
        return;

    rollDiceComputer();

}


function rollDiceComputer() {

    rollBtn.disabled = true;

    dice.classList.add(
        "rolling"
    );

    setTimeout(
        () => {

            diceValue =
                Math.floor(
                    Math.random() * 6
                ) + 1;

            dice.textContent =
                diceEmoji(
                    diceValue
                );

            dice.classList.remove(
                "rolling"
            );

            beep(
                600,
                .1
            );

            const movable =
                getMovableTokens(
                    currentPlayer,
                    diceValue
                );


            if (
                movable.length === 0
            ) {

                setTimeout(
                    nextTurn,
                    700
                );

                return;

            }


            setTimeout(
                () => {

                    computerMove(
                        movable
                    );

                },
                450
            );

        },
        600
    );

}


/* =====================================================
   COMPUTER MOVE
===================================================== */

function computerMove(
    movable
) {

    if (!movable.length)
        return;


    /*
       Prefer tokens close to finish,
       otherwise choose randomly.
    */

    let best =
        movable
        .sort(
            (a,b) =>
                tokens[b].position -
                tokens[a].position
        )[0];


    if (
        Math.random() < .35
    ) {

        best =
            movable[
                Math.floor(
                    Math.random() *
                    movable.length
                )
            ];

    }


    moveToken(best);

}


/* =====================================================
   NEXT TURN
===================================================== */

function nextTurn() {

    diceValue = 0;

    currentPlayer =
        (
            currentPlayer + 1
        ) %
        players.length;

    updateTurn();


    if (
        players[currentPlayer].computer
    ) {

        setTimeout(
            computerTurn,
            700
        );

    }

    else {

        rollBtn.disabled =
            false;

    }

}


/* =====================================================
   TURN UI
===================================================== */

function updateTurn() {

    players.forEach(
        (_,index) => {

            const card =
                document.getElementById(
                    "playerCard-" + index
                );

            if (card) {

                card.classList.toggle(
                    "active",
                    index === currentPlayer
                );

            }

        }
    );


    const player =
        players[currentPlayer];

    turnText.textContent =
        `${player.emoji} ${player.name}'s turn`
        +
        (
            player.computer
            ? " 🤖"
            : ""
        );

}


/* =====================================================
   WINNER
===================================================== */

function showWinner(
    playerIndex
) {

    gameOver = true;

    const player =
        players[playerIndex];

    winnerTitle.textContent =
        `${player.emoji} ${player.name} Wins!`;

    winnerOverlay.style.display =
        "flex";

    beep(
        900,
        .2,
        "triangle"
    );

    setTimeout(
        () => beep(1100,.2),
        180
    );

}


/* =====================================================
   NEW GAME
===================================================== */

document.getElementById(
    "newGameBtn"
).addEventListener(
    "click",
    () => {

        winnerOverlay.style.display =
            "none";

        startGame();

    }
);


document.getElementById(
    "winnerNewBtn"
).addEventListener(
    "click",
    () => {

        winnerOverlay.style.display =
            "none";

        startGame();

    }
);


/* =====================================================
   BACK MENU
===================================================== */

document.getElementById(
    "backBtn"
).addEventListener(
    "click",
    () => {

        gameScreen.style.display =
            "none";

        startScreen.style.display =
            "flex";

        gameOver = false;

    }
);

</script>
