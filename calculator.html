<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calculator - ZnovaFox</title>

    <link
        rel="stylesheet"
        href="../../css/main.css"
    >

    <style>

        .calculator-box {
            max-width: 380px;
            margin: 40px auto;
            padding: 20px;

            border: 1px solid #ddd;
            border-radius: 20px;

            background: var(--card-bg, #ffffff);
        }

        .calculator-display {
            width: 100%;
            box-sizing: border-box;

            padding: 18px;

            margin-bottom: 15px;

            border: 1px solid #ddd;
            border-radius: 12px;

            font-size: 28px;
            text-align: right;

            background: transparent;
        }

        .calculator-buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }

        .calculator-buttons button {

            min-height: 58px;

            border: none;
            border-radius: 12px;

            font-size: 18px;

            cursor: pointer;

            background: #f1f1f1;
        }

        .calculator-buttons button:hover {
            opacity: 0.8;
        }

        .calculator-buttons .operator {
            font-weight: bold;
        }

        .calculator-buttons .equals {
            grid-column: span 2;
            font-weight: bold;
        }

        .calculator-buttons .clear {
            font-weight: bold;
        }

        body.dark .calculator-box {
            border-color: #333;
        }

        body.dark
        .calculator-buttons button {
            background: #252a32;
            color: white;
        }

    </style>

</head>

            <button

                ☰

<main>


    <section class="hero">

        <div class="container">

            <p class="live-status">
                <span></span> LIVE
            </p>

            <h1>
                Calculator
            </h1>

            <p class="hero-text">
                Fast and simple online calculator.
            </p>

        </div>

    </section>



    <section class="service-section">

        <div class="container">


            <div class="calculator-box">


                <input
                    type="text"
                    id="calculatorDisplay"
                    class="calculator-display"
                    value="0"
                    readonly
                >


                <div class="calculator-buttons">

                    <button
                        class="clear"
                        onclick="clearCalculator()"
                    >
                        C
                    </button>

                    <button
                        onclick="deleteLast()"
                    >
                        ⌫
                    </button>

                    <button
                        class="operator"
                        onclick="addToCalculator('%')"
                    >
                        %
                    </button>

                    <button
                        class="operator"
                        onclick="addToCalculator('/')"
                    >
                        ÷
                    </button>


                    <button
                        onclick="addToCalculator('7')"
                    >
                        7
                    </button>

                    <button
                        onclick="addToCalculator('8')"
                    >
                        8
                    </button>

                    <button
                        onclick="addToCalculator('9')"
                    >
                        9
                    </button>

                    <button
                        class="operator"
                        onclick="addToCalculator('*')"
                    >
                        ×
                    </button>


                    <button
                        onclick="addToCalculator('4')"
                    >
                        4
                    </button>

                    <button
                        onclick="addToCalculator('5')"
                    >
                        5
                    </button>

                    <button
                        onclick="addToCalculator('6')"
                    >
                        6
                    </button>

                    <button
                        class="operator"
                        onclick="addToCalculator('-')"
                    >
                        −
                    </button>


                    <button
                        onclick="addToCalculator('1')"
                    >
                        1
                    </button>

                    <button
                        onclick="addToCalculator('2')"
                    >
                        2
                    </button>

                    <button
                        onclick="addToCalculator('3')"
                    >
                        3
                    </button>

                    <button
                        class="operator"
                        onclick="addToCalculator('+')"
                    >
                        +
                    </button>


                    <button
                        onclick="addToCalculator('0')"
                    >
                        0
                    </button>

                    <button
                        onclick="addToCalculator('.')"
                    >
                        .
                    </button>

                    <button
                        class="equals"
                        onclick="calculateResult()"
                    >
                        =
                    </button>

                </div>

            </div>

        </div>

    </section>


</main>

<script src="../../js/main.js"></script>


<script>

    const display =
        document.getElementById(
            "calculatorDisplay"
        );


    function addToCalculator(value) {

        if (display.value === "0") {

            display.value = value;

        } else {

            display.value += value;

        }

    }


    function clearCalculator() {

        display.value = "0";

    }


    function deleteLast() {

        if (
            display.value.length <= 1
        ) {

            display.value = "0";

        } else {

            display.value =
                display.value.slice(0, -1);

        }

    }


    function calculateResult() {

        try {

            const expression =
                display.value
                    .replace(/%/g, "/100");


            const result =
                Function(
                    '"use strict"; return (' +
                    expression +
                    ')'
                )();


            if (
                typeof result !== "number" ||
                !Number.isFinite(result)
            ) {

                throw new Error();

            }


            display.value = result;

        } catch {

            display.value = "Error";

        }

    }

</script>
