<script src="../../js/main.js"></script>


<script>


const unitType =
    document.getElementById("unitType");

const fromUnit =
    document.getElementById("fromUnit");

const toUnit =
    document.getElementById("toUnit");

const inputValue =
    document.getElementById("inputValue");

const conversionResult =
    document.getElementById(
        "conversionResult"
    );



const units = {

    length: {

        meter: 1,

        kilometer: 1000,

        centimeter: 0.01,

        millimeter: 0.001,

        mile: 1609.344,

        yard: 0.9144,

        foot: 0.3048,

        inch: 0.0254

    },


    weight: {

        kilogram: 1,

        gram: 0.001,

        milligram: 0.000001,

        pound: 0.45359237,

        ounce: 0.0283495231

    },


    storage: {

        byte: 1,

        kilobyte: 1024,

        megabyte: 1024 * 1024,

        gigabyte: 1024 * 1024 * 1024,

        terabyte:
            1024 * 1024 * 1024 * 1024

    }

};



function populateUnits() {

    const type =
        unitType.value;


    fromUnit.innerHTML = "";

    toUnit.innerHTML = "";


    if (type === "temperature") {

        const temperatureUnits = [
            ["celsius", "Celsius"],
            ["fahrenheit", "Fahrenheit"],
            ["kelvin", "Kelvin"]
        ];


        temperatureUnits.forEach(
            function (unit) {

                const option1 =
                    document.createElement(
                        "option"
                    );

                option1.value =
                    unit[0];

                option1.textContent =
                    unit[1];


                const option2 =
                    option1.cloneNode(true);


                fromUnit.appendChild(
                    option1
                );

                toUnit.appendChild(
                    option2
                );

            }
        );


    } else {

        Object.keys(
            units[type]
        ).forEach(
            function (unit) {

                const option1 =
                    document.createElement(
                        "option"
                    );

                option1.value =
                    unit;

                option1.textContent =
                    unit;


                const option2 =
                    option1.cloneNode(true);


                fromUnit.appendChild(
                    option1
                );

                toUnit.appendChild(
                    option2
                );

            }
        );

    }


    convert();

}



function convertTemperature(
    value,
    from,
    to
) {

    let celsius;


    if (from === "celsius") {

        celsius = value;

    } else if (
        from === "fahrenheit"
    ) {

        celsius =
            (value - 32) * 5 / 9;

    } else {

        celsius =
            value - 273.15;

    }


    if (to === "celsius") {

        return celsius;

    }


    if (to === "fahrenheit") {

        return (
            celsius * 9 / 5
        ) + 32;

    }


    return celsius + 273.15;

}



function convert() {

    const value =
        Number(inputValue.value);


    if (
        Number.isNaN(value)
    ) {

        conversionResult.textContent =
            "Invalid value";

        return;

    }


    const type =
        unitType.value;


    let result;


    if (type === "temperature") {

        result =
            convertTemperature(
                value,
                fromUnit.value,
                toUnit.value
            );

    } else {

        const baseValue =
            value *
            units[type][fromUnit.value];


        result =
            baseValue /
            units[type][toUnit.value];

    }


    conversionResult.textContent =
        Number(result.toFixed(8));

}



unitType.addEventListener(
    "change",
    populateUnits
);


fromUnit.addEventListener(
    "change",
    convert
);


toUnit.addEventListener(
    "change",
    convert
);


inputValue.addEventListener(
    "input",
    convert
);


populateUnits();


</script>
